<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرفة انقطاعات الكهرباء في منطقتك</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #1e40af;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .header p {
            color: #6b7280;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid;
        }
        
        .stat-card.working {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }
        
        .stat-card.outage {
            background: #fef2f2;
            border-color: #ef4444;
            color: #dc2626;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
        }
        
        .form-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .form-card h3 {
            margin-bottom: 15px;
            color: #1e40af;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        
        .btn:hover {
            background: #2563eb;
        }
        
        .districts-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .districts-card h3 {
            margin-bottom: 20px;
            color: #1e40af;
        }
        
        .district-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 10px;
        }
        
        .district-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .district-info p {
            font-size: 14px;
            color: #6b7280;
        }
        
        .district-status {
            text-align: right;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .status-working {
            background: #dcfce7;
            color: #166534;
        }
        
        .status-outage {
            background: #fef2f2;
            color: #dc2626;
        }
        
        .status-partial {
            background: #fef3c7;
            color: #d97706;
        }
        
        .status-unknown {
            background: #f3f4f6;
            color: #6b7280;
        }
        
        .confirmation-count {
            font-size: 12px;
            color: #6b7280;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔍 معرفة انقطاعات الكهرباء في منطقتك</h1>
            <p>تتبع حالة الكهرباء في مديريات عدن</p>
        </div>

        <!-- Statistics -->
        <div class="stats">
            <div class="stat-card working">
                <div class="stat-number" id="working-count">5</div>
                <div class="stat-label">لاصيه</div>
            </div>
            <div class="stat-card outage">
                <div class="stat-number" id="outage-count">4</div>
                <div class="stat-label">طافيه</div>
            </div>
        </div>

        <!-- Report Form -->
        <div class="form-card">
            <h3>📝 إبلاغ عن حالة الكهرباء</h3>
            <div class="form-group">
                <label for="district-select">المديرية:</label>
                <select id="district-select" onchange="filterDistricts()">
                    <option value="">جميع المديريات</option>
                    <option value="كريتر">كريتر</option>
                    <option value="المعلا">المعلا</option>
                    <option value="التواهي">التواهي</option>
                    <option value="المنصورة">المنصورة</option>
                    <option value="الشيخ عثمان">الشيخ عثمان</option>
                    <option value="خور مكسر">خور مكسر</option>
                    <option value="دار سعد">دار سعد</option>
                    <option value="البريقة">البريقة</option>
                    <option value="صيرة">صيرة</option>
                </select>
            </div>
            <button class="btn" onclick="submitReport()">إرسال بلاغ</button>
        </div>

        <!-- Districts Status -->
        <div class="districts-card">
            <h3>🏘️ حالة المديريات</h3>
            <div id="districts-list">
                <!-- Districts will be populated by JavaScript -->
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            آخر تحديث: <span id="last-update"></span>
        </div>
    </div>

    <script>
        // Mock data
        const districtsData = [
            { district: 'كريتر', status: 'لاصيه', count: 3, lastUpdate: '5 دقائق' },
            { district: 'المعلا', status: 'طافيه', count: 5, lastUpdate: '30 دقيقة' },
            { district: 'التواهي', status: 'جزئية', count: 2, lastUpdate: '15 دقيقة' },
            { district: 'المنصورة', status: 'لاصيه', count: 1, lastUpdate: '2 دقيقة' },
            { district: 'خور مكسر', status: 'طافيه', count: 4, lastUpdate: '45 دقيقة' },
            { district: 'الشيخ عثمان', status: 'لاصيه', count: 2, lastUpdate: '10 دقائق' },
            { district: 'دار سعد', status: 'غير معروف', count: 0, lastUpdate: '60 دقيقة' },
            { district: 'البريقة', status: 'لاصيه', count: 1, lastUpdate: '8 دقائق' },
            { district: 'صيرة', status: 'طافيه', count: 3, lastUpdate: '20 دقيقة' }
        ];

        // Initialize page
        function initPage() {
            updateStatistics();
            renderDistricts();
            updateLastUpdate();
        }

        // Update statistics
        function updateStatistics() {
            const workingCount = districtsData.filter(d => d.status === 'لاصيه').length;
            const outageCount = districtsData.filter(d => d.status === 'طافيه').length;
            
            document.getElementById('working-count').textContent = workingCount;
            document.getElementById('outage-count').textContent = outageCount;
        }

        // Render districts
        function renderDistricts(filteredData = districtsData) {
            const container = document.getElementById('districts-list');
            container.innerHTML = '';

            filteredData.forEach(item => {
                const districtElement = document.createElement('div');
                districtElement.className = 'district-item';
                
                const statusClass = getStatusClass(item.status);
                
                districtElement.innerHTML = `
                    <div class="district-info">
                        <h4>${item.district}</h4>
                        <p>آخر تحديث: منذ ${item.lastUpdate}</p>
                    </div>
                    <div class="district-status">
                        <div class="status-badge ${statusClass}">${item.status}</div>
                        <div class="confirmation-count">${item.count} تأكيد</div>
                    </div>
                `;
                
                container.appendChild(districtElement);
            });
        }

        // Get status CSS class
        function getStatusClass(status) {
            switch (status) {
                case 'لاصيه': return 'status-working';
                case 'طافيه': return 'status-outage';
                case 'جزئية': return 'status-partial';
                default: return 'status-unknown';
            }
        }

        // Filter districts
        function filterDistricts() {
            const selectedDistrict = document.getElementById('district-select').value;
            const filteredData = selectedDistrict 
                ? districtsData.filter(item => item.district === selectedDistrict)
                : districtsData;
            renderDistricts(filteredData);
        }

        // Submit report
        function submitReport() {
            const selectedDistrict = document.getElementById('district-select').value;
            if (!selectedDistrict) {
                alert('يرجى اختيار المديرية أولاً');
                return;
            }
            
            alert(`تم إرسال البلاغ بنجاح لمديرية ${selectedDistrict}!`);
            
            // Simulate updating the data
            const district = districtsData.find(d => d.district === selectedDistrict);
            if (district) {
                district.count += 1;
                district.lastUpdate = 'الآن';
                renderDistricts();
                updateStatistics();
            }
        }

        // Update last update time
        function updateLastUpdate() {
            const now = new Date();
            const timeString = now.toLocaleString('ar-SA');
            document.getElementById('last-update').textContent = timeString;
        }

        // Initialize page when loaded
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
