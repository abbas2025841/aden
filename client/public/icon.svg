<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="96" cy="96" r="88" fill="url(#gradient0_linear_1_1)"/>
  
  <!-- Clock Face -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Clock Center -->
  <circle cx="96" cy="96" r="6" fill="#FFFFFF"/>
  
  <!-- Hour Hand (pointing to 12) -->
  <line x1="96" y1="96" x2="96" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Minute Hand (pointing to 3) -->
  <line x1="96" y1="96" x2="120" y2="96" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Hour Markers -->
  <line x1="96" y1="30" x2="96" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="162" y1="96" x2="152" y2="96" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="162" x2="96" y2="152" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="96" x2="40" y2="96" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Aden Text -->
  <text x="96" y="140" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle">عدن</text>
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="142" cy="50" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="50" cy="142" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="142" cy="142" r="3" fill="#FFFFFF" opacity="0.6"/>
  
  <defs>
    <linearGradient id="gradient0_linear_1_1" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB6107"/>
      <stop offset="1" stop-color="#FFA500"/>
    </linearGradient>
  </defs>
